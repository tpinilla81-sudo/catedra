name: CI migraciones Neon (deploy nativo en Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Baseline P3005 (sella migraciones previas, no toca datos)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx --yes prisma@6.11.1 migrate resolve --applied 20261106222758_init_schema_v0_1 || true
          npx --yes prisma@6.11.1 migrate resolve --applied 20261107000000_engine_columns_and_report_author || true
          npx --yes prisma@6.11.1 migrate resolve --applied 20261108000000_p41_scouting_rival || true
      - name: Migrar Neon (solo CREATE)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx --yes prisma@6.11.1 migrate deploy
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependencias + seed (no bloquea el deploy)
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          bun install --frozen-lockfile
          bunx prisma generate
          bun prisma/seed.ts || echo "Seed fallo - se continua (no bloquea)"
